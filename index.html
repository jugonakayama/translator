<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AI同時通訳</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --danger: #ef4444; --text: #f8fafc; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h1 { font-size: 1.1rem; margin: 0; font-weight: 700; }
    .settings-btn { background: var(--card); border: 1px solid #334155; color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; }
    .lang-bar { display: flex; gap: 8px; align-items: center; background: var(--card); padding: 10px; border-radius: 12px; margin-bottom: 12px; }
    select { flex: 1; background: #0f172a; color: var(--text); border: 1px solid #334155; padding: 10px; border-radius: 8px; font-size: 1rem; font-weight: 600; }
    .swap { font-size: 1.2rem; color: #94a3b8; }
    .log-box { flex: 1; background: var(--card); border-radius: 14px; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; border: 1px solid #334155; }
    .status { font-size: 0.85rem; color: #94a3b8; text-align: center; padding: 6px; word-break: break-all; }
    .transcript { font-size: 1.15rem; line-height: 1.5; background: #0f172a; padding: 12px; border-radius: 10px; border-left: 4px solid var(--accent); }
    .main-btn { width: 100%; padding: 20px; border-radius: 16px; border: none; font-size: 1.2rem; font-weight: 700; color: white; background: var(--accent); cursor: pointer; transition: 0.2s; box-shadow: 0 4px 14px rgba(59,130,246,0.4); }
    .main-btn.active { background: var(--danger); box-shadow: 0 4px 14px rgba(239,68,68,0.4); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.85; } 100% { opacity: 1; } }
    #apiModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; padding: 20px; z-index: 50; }
    .modal-card { background: var(--card); padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; }
    .modal-card input { width: 100%; padding: 12px; margin: 12px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; }
  </style>
</head>
<body>

<header>
  <h1>🎙️ Gemini リアルタイム同時通訳</h1>
  <button class="settings-btn" onclick="openModal()">⚙️ APIキー</button>
</header>

<div class="lang-bar">
  <select id="langA">
    <option value="日本語" selected>🇯🇵 日本語</option>
    <option value="英語">🇺🇸 英語</option>
    <option value="中国語">🇨🇳 中国語</option>
    <option value="韓国語">🇰🇷 韓国語</option>
    <option value="スペイン語">🇪🇸 スペイン語</option>
    <option value="フランス語">🇫🇷 フランス語</option>
    <option value="ドイツ語">🇩🇪 ドイツ語</option>
  </select>
  <span class="swap">⇄</span>
  <select id="langB">
    <option value="英語" selected>🇺🇸 英語</option>
    <option value="日本語">🇯🇵 日本語</option>
    <option value="中国語">🇨🇳 中国語</option>
    <option value="韓国語">🇰🇷 韓国語</option>
    <option value="スペイン語">🇪🇸 スペイン語</option>
    <option value="フランス語">🇫🇷 フランス語</option>
    <option value="ドイツ語">🇩🇪 ドイツ語</option>
  </select>
</div>

<div class="log-box" id="logBox">
  <div class="status" id="statusText">「通訳開始」を押して話しかけてください</div>
</div>

<button class="main-btn" id="toggleBtn" onclick="toggleSession()">通訳開始</button>

<div id="apiModal">
  <div class="modal-card">
    <h3 style="margin-top:0">Gemini APIキー設定</h3>
    <p style="font-size:0.85rem; color:#cbd5e1;">キーはこのスマホのブラウザ内にのみ保存されます。</p>
    <input type="password" id="apiKeyInput" placeholder="APIキーを貼り付け..." />
    <button class="main-btn" style="padding:12px; font-size:1rem;" onclick="saveKey()">保存する</button>
  </div>
</div>

<script>
  let ws = null;
  let audioCtx = null;
  let micStream = null;
  let processor = null;
  let isRunning = false;
  let nextPlayTime = 0;

  const MODEL = "models/gemini-2.5-flash-native-audio-preview-12-2025";

  window.onload = () => {
    if (!localStorage.getItem("gemini_api_key")) openModal();
  };

  function openModal() {
    document.getElementById("apiKeyInput").value = localStorage.getItem("gemini_api_key") || "";
    document.getElementById("apiModal").style.display = "flex";
  }

  function saveKey() {
    const key = document.getElementById("apiKeyInput").value.trim();
    if (key) {
      localStorage.setItem("gemini_api_key", key);
      document.getElementById("apiModal").style.display = "none";
    }
  }

  function setStatus(msg) {
    document.getElementById("statusText").textContent = msg;
  }

  function appendTranscript(text) {
    const box = document.getElementById("logBox");
    let last = box.lastElementChild;
    if (!last || !last.classList.contains("transcript") || last.dataset.done === "true") {
      last = document.createElement("div");
      last.className = "transcript";
      box.appendChild(last);
    }
    last.textContent += text;
    box.scrollTop = box.scrollHeight;
  }

  async function toggleSession() {
    if (isRunning) {
      stopSession("停止中（「通訳開始」で再開）");
    } else {
      await startSession();
    }
  }

  async function startSession() {
    const apiKey = localStorage.getItem("gemini_api_key");
    if (!apiKey) return openModal();

    const langA = document.getElementById("langA").value;
    const langB = document.getElementById("langB").value;
    const btn = document.getElementById("toggleBtn");

    try {
      setStatus("接続中...");
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      if (audioCtx.state === "suspended") await audioCtx.resume();
      nextPlayTime = audioCtx.currentTime;

      micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });

      const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`;
      ws = new WebSocket(url);

      ws.onopen = () => {
        const setupMsg = {
          setup: {
            model: MODEL,
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } }
            },
            systemInstruction: {
              parts: [{
                text: `あなたはプロの同時通訳者です。ユーザーの話す言語を聞き取り、${langA}なら${langB}へ、${langB}なら${langA}へ即座に翻訳して発話してください。返事・相槌・解説は一切禁止です。翻訳結果のみを自然な口調で出力してください。`
              }]
            }
          }
        };
        ws.send(JSON.stringify(setupMsg));
        startMicStreaming();
        isRunning = true;
        btn.textContent = "通訳を停止";
        btn.classList.add("active");
        setStatus(`通訳中（${langA} ⇄ ${langB}）`);
      };

      ws.onmessage = async (event) => {
        const raw = event.data instanceof Blob ? await event.data.text() : event.data;
        const data = JSON.parse(raw);

        if (data.serverContent?.modelTurn?.parts) {
          for (const part of data.serverContent.modelTurn.parts) {
            if (part.inlineData && part.inlineData.mimeType.startsWith("audio/pcm")) {
              playPcmAudio(part.inlineData.data);
            }
            if (part.text) {
              appendTranscript(part.text);
            }
          }
        }
        if (data.serverContent?.outputTranscription?.text) {
          appendTranscript(data.serverContent.outputTranscription.text);
        }
        if (data.serverContent?.turnComplete) {
          const last = document.getElementById("logBox").lastElementChild;
          if (last && last.classList.contains("transcript")) last.dataset.done = "true";
        }
      };

      ws.onerror = () => {
        stopSession("通信エラーが発生しました（APIキーを確認してください）");
      };

      ws.onclose = (e) => {
        if (isRunning) {
          stopSession(`切断されました (コード:${e.code} ${e.reason || ""})`);
        }
      };

    } catch (err) {
      stopSession("エラー: " + err.message);
    }
  }

  function startMicStreaming() {
    const source = audioCtx.createMediaStreamSource(micStream);
    processor = audioCtx.createScriptProcessor(4096, 1, 1);

    processor.onaudioprocess = (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const floatData = e.inputBuffer.getChannelData(0);
      const pcm16 = new Int16Array(floatData.length);
      for (let i = 0; i < floatData.length; i++) {
        const s = Math.max(-1, Math.min(1, floatData[i]));
        pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      const base64 = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
      ws.send(JSON.stringify({
        realtimeInput: {
          audio: { mimeType: "audio/pcm;rate=16000", data: base64 }
        }
      }));
    };

    source.connect(processor);
    processor.connect(audioCtx.destination);
  }

  function playPcmAudio(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const pcm16 = new Int16Array(bytes.buffer);
    const float32 = new Float32Array(pcm16.length);
    for (let i = 0; i < pcm16.length; i++) float32[i] = pcm16[i] / 32768;

    const buffer = audioCtx.createBuffer(1, float32.length, 24000);
    buffer.getChannelData(0).set(float32);

    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.connect(audioCtx.destination);

    const startTime = Math.max(audioCtx.currentTime, nextPlayTime);
    src.start(startTime);
    nextPlayTime = startTime + buffer.duration;
  }

  function stopSession(reasonMsg) {
    isRunning = false;
    if (processor) { processor.disconnect(); processor = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (ws) { ws.close(); ws = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }

    const btn = document.getElementById("toggleBtn");
    btn.textContent = "通訳開始";
    btn.classList.remove("active");
    if (reasonMsg) setStatus(reasonMsg);
  }
</script>
</body>
</html>
