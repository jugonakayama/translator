<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AIリアルタイム字幕通訳 v3.0</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --danger: #ef4444; --text: #f8fafc; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; padding: 14px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
    .header-btns { display: flex; gap: 6px; }
    .icon-btn { background: var(--card); border: 1px solid #334155; color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
    .lang-bar { display: flex; gap: 8px; align-items: center; background: var(--card); padding: 8px; border-radius: 12px; margin-bottom: 10px; }
    select { flex: 1; background: #0f172a; color: var(--text); border: 1px solid #334155; padding: 10px; border-radius: 8px; font-size: 1rem; font-weight: 600; }
    .swap-btn { background: #0f172a; border: 1px solid #334155; color: var(--text); font-size: 1.2rem; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    .swap-btn:active { transform: scale(0.92); background: #334155; }
    .log-box { flex: 1; background: var(--card); border-radius: 14px; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; border: 1px solid #334155; scroll-behavior: smooth; }
    .status { font-size: 0.85rem; color: #94a3b8; text-align: center; padding: 4px; word-break: break-all; }
    .transcript { font-size: 1.3rem; font-weight: 500; line-height: 1.55; background: #0f172a; padding: 14px 16px; border-radius: 12px; border-left: 5px solid var(--accent); letter-spacing: 0.02em; }
    .main-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; font-size: 1.15rem; font-weight: 700; color: white; background: var(--accent); cursor: pointer; transition: 0.2s; box-shadow: 0 4px 14px rgba(59,130,246,0.4); -webkit-tap-highlight-color: transparent; }
    .main-btn.active { background: var(--danger); box-shadow: 0 4px 14px rgba(239,68,68,0.4); }
    #apiModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; padding: 20px; z-index: 50; }
    .modal-card { background: var(--card); padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; }
    .modal-card input { width: 100%; padding: 12px; margin: 12px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; }
  </style>
</head>
<body>

<header>
  <h1>💬 リアルタイム字幕通訳 v3.0</h1>
  <div class="header-btns">
    <button class="icon-btn" onclick="clearLogs()">🗑️ クリア</button>
    <button class="icon-btn" onclick="openModal()">⚙️ キー</button>
  </div>
</header>

<div class="lang-bar">
  <select id="langA" onchange="onLangChange()">
    <option value="日本語" selected>🇯🇵 日本語</option>
    <option value="英語">🇺🇸 英語</option>
    <option value="中国語">🇨🇳 中国語</option>
    <option value="韓国語">🇰🇷 韓国語</option>
    <option value="スペイン語">🇪🇸 スペイン語</option>
    <option value="フランス語">🇫🇷 フランス語</option>
    <option value="ドイツ語">🇩🇪 ドイツ語</option>
  </select>
  <button class="swap-btn" onclick="swapLanguages()" title="言語を入れ替え">⇄</button>
  <select id="langB" onchange="onLangChange()">
    <option value="英語" selected>🇺🇸 英語</option>
    <option value="日本語">🇯🇵 日本語</option>
    <option value="中国語">🇨🇳 中国語</option>
    <option value="韓国語">🇰🇷 韓国語</option>
    <option value="スペイン語">🇪🇸 スペイン語</option>
    <option value="フランス語">🇫🇷 フランス語</option>
    <option value="ドイツ語">🇩🇪 ドイツ語</option>
  </select>
</div>

<div class="log-box" id="logBox">
  <div class="status" id="statusText">「通訳開始」を押すと文字でリアルタイム翻訳されます</div>
</div>

<button class="main-btn" id="toggleBtn" onclick="toggleSession()">通訳開始</button>

<div id="apiModal">
  <div class="modal-card">
    <h3 style="margin-top:0">Gemini APIキー設定</h3>
    <p style="font-size:0.85rem; color:#cbd5e1;">キーはこのスマホのブラウザ内にのみ保存されます。</p>
    <input type="password" id="apiKeyInput" placeholder="APIキーを貼り付け..." />
    <button class="main-btn" style="padding:12px; font-size:1rem;" onclick="saveKey()">保存する</button>
  </div>
</div>

<script>
  let ws = null;
  let audioCtx = null;
  let micStream = null;
  let processor = null;
  let isRunning = false;

  const MODEL = "models/gemini-2.5-flash-native-audio-preview-12-2025";

  window.onload = () => {
    if (!localStorage.getItem("gemini_api_key")) openModal();
  };

  function openModal() {
    document.getElementById("apiKeyInput").value = localStorage.getItem("gemini_api_key") || "";
    document.getElementById("apiModal").style.display = "flex";
  }

  function saveKey() {
    const key = document.getElementById("apiKeyInput").value.trim();
    if (key) {
      localStorage.setItem("gemini_api_key", key);
      document.getElementById("apiModal").style.display = "none";
      setStatus("APIキーを保存しました。「通訳開始」を押してください");
    }
  }

  function clearLogs() {
    const box = document.getElementById("logBox");
    const status = document.getElementById("statusText");
    box.innerHTML = "";
    box.appendChild(status);
  }

  async function swapLanguages() {
    const selA = document.getElementById("langA");
    const selB = document.getElementById("langB");
    const temp = selA.value;
    selA.value = selB.value;
    selB.value = temp;
    await onLangChange();
  }

  async function onLangChange() {
    if (isRunning) {
      stopSession();
      await startSession();
    }
  }

  function setStatus(msg) {
    document.getElementById("statusText").textContent = msg;
  }

  function appendTranscript(text) {
    if (!text) return;
    const box = document.getElementById("logBox");
    let last = box.lastElementChild;
    if (!last || !last.classList.contains("transcript") || last.dataset.done === "true") {
      last = document.createElement("div");
      last.className = "transcript";
      box.appendChild(last);
    }
    last.textContent += text;
    box.scrollTop = box.scrollHeight;
  }

  async function toggleSession() {
    if (isRunning) {
      stopSession("停止中（「通訳開始」で再開）");
    } else {
      await startSession();
    }
  }

  async function startSession() {
    setStatus("⏳ マイクとサーバーに接続中...");
    const apiKey = localStorage.getItem("gemini_api_key");
    if (!apiKey) {
      setStatus("APIキーが未設定です");
      return openModal();
    }

    const langA = document.getElementById("langA").value;
    const langB = document.getElementById("langB").value;
    const btn = document.getElementById("toggleBtn");

    try {
      // iPhone Safariの標準レートに任せて初期化（強制16000Hz指定のエラーを回避）
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
      if (audioCtx.state === "suspended") await audioCtx.resume();

      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });

      const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`;
      ws = new WebSocket(url);

      ws.onopen = () => {
        const setupMsg = {
          setup: {
            model: MODEL,
            generationConfig: {
              responseModalities: ["AUDIO"]
            },
            outputAudioTranscription: {},
            systemInstruction: {
              parts: [{
                text: `あなたは超高速な同時通訳者です。聞こえた音声をリアルタイムで翻訳し、${langA}なら${langB}へ、${langB}なら${langA}へ即座に翻訳してください。返事・相槌・解説は一切禁止です。文の終わりを待たず、聞こえたそばから自然な訳文のみを出力してください。`
              }]
            }
          }
        };
        ws.send(JSON.stringify(setupMsg));
        startMicStreaming();
        isRunning = true;
        btn.textContent = "通訳を停止";
        btn.classList.add("active");
        setStatus(`🟢 リアルタイム字幕中（${langA} ⇄ ${langB}）`);
      };

      ws.onmessage = async (event) => {
        const raw = event.data instanceof Blob ? await event.data.text() : event.data;
        const data = JSON.parse(raw);

        if (data.serverContent?.outputTranscription?.text) {
          appendTranscript(data.serverContent.outputTranscription.text);
        }
        if (data.serverContent?.turnComplete) {
          const last = document.getElementById("logBox").lastElementChild;
          if (last && last.classList.contains("transcript")) last.dataset.done = "true";
        }
      };

      ws.onerror = () => {
        stopSession("通信エラーが発生しました（APIキーを確認してください）");
      };

      ws.onclose = (e) => {
        if (isRunning) {
          stopSession(`切断されました (コード:${e.code} ${e.reason || ""})`);
        }
      };

    } catch (err) {
      stopSession("起動エラー: " + err.message);
    }
  }

  function startMicStreaming() {
    const source = audioCtx.createMediaStreamSource(micStream);
    processor = audioCtx.createScriptProcessor(2048, 1, 1);
    const inputSampleRate = audioCtx.sampleRate;
    const targetSampleRate = 16000;

    processor.onaudioprocess = (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const floatData = e.inputBuffer.getChannelData(0);
      
      // iPhoneの48000Hz音声を16000Hzへ綺麗にダウンサンプリング
      const ratio = inputSampleRate / targetSampleRate;
      const newLength = Math.round(floatData.length / ratio);
      const pcm16 = new Int16Array(newLength);
      for (let i = 0; i < newLength; i++) {
        const idx = Math.min(floatData.length - 1, Math.round(i * ratio));
        const s = Math.max(-1, Math.min(1, floatData[idx]));
        pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }

      const bytes = new Uint8Array(pcm16.buffer);
      let binary = "";
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      const base64 = btoa(binary);

      ws.send(JSON.stringify({
        realtimeInput: {
          audio: { mimeType: "audio/pcm;rate=16000", data: base64 }
        }
      }));
    };

    source.connect(processor);
    processor.connect(audioCtx.destination);
  }

  function stopSession(reasonMsg) {
    isRunning = false;
    if (processor) { processor.disconnect(); processor = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (ws) { ws.close(); ws = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }

    const btn = document.getElementById("toggleBtn");
    btn.textContent = "通訳開始";
    btn.classList.remove("active");
    if (reasonMsg) setStatus(reasonMsg);
  }
</script>
</body>
</html>
