<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin />
  <title>AIリアルタイム字幕通訳 v5.1</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --danger: #ef4444; --text: #f8fafc; --sub: #94a3b8; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; padding: 14px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
    .header-btns { display: flex; gap: 6px; }
    .icon-btn { background: var(--card); border: 1px solid #334155; color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
    .lang-bar { display: flex; gap: 8px; align-items: center; background: var(--card); padding: 8px; border-radius: 12px; margin-bottom: 10px; }
    select { flex: 1; background: #0f172a; color: var(--text); border: 1px solid #334155; padding: 10px; border-radius: 8px; font-size: 1rem; font-weight: 600; }
    .swap-btn { background: #0f172a; border: 1px solid #334155; color: var(--text); font-size: 1.2rem; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    .log-box { flex: 1; background: var(--card); border-radius: 14px; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; border: 1px solid #334155; }
    .status { font-size: 0.85rem; color: var(--sub); text-align: center; padding: 4px; }
    .live-card { background: rgba(59, 130, 246, 0.14); border: 1px dashed var(--accent); padding: 12px 14px; border-radius: 12px; display: none; }
    .live-orig { font-size: 0.85rem; color: #93c5fd; margin-bottom: 4px; }
    .live-trans { font-size: 1.2rem; font-weight: 600; color: #e2e8f0; min-height: 1.4em; }
    .card-item { background: #0f172a; padding: 12px 14px; border-radius: 12px; border-left: 4px solid var(--accent); }
    .orig-text { font-size: 0.85rem; color: var(--sub); margin-bottom: 4px; }
    .trans-text { font-size: 1.25rem; font-weight: 600; line-height: 1.45; color: var(--text); }
    .main-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; font-size: 1.15rem; font-weight: 700; color: white; background: var(--accent); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .main-btn.active { background: var(--danger); }
    #apiModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; padding: 20px; z-index: 50; }
    .modal-card { background: var(--card); padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; }
    .modal-card input { width: 100%; padding: 12px; margin: 12px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; }
  </style>
</head>
<body>

<header>
  <h1>⚡ リアルタイム字幕通訳 v5.1</h1>
  <div class="header-btns">
    <button class="icon-btn" onclick="clearLogs()">🗑️ クリア</button>
    <button class="icon-btn" onclick="openModal()">⚙️ キー</button>
  </div>
</header>

<div class="lang-bar">
  <select id="langFrom" onchange="restartIfRunning()">
    <option value="ja-JP|ja|Japanese" selected>🇯🇵 日本語から</option>
    <option value="en-US|en|English">🇺🇸 英語から</option>
    <option value="zh-CN|zh-CN|Chinese">🇨🇳 中国語から</option>
    <option value="ko-KR|ko|Korean">🇰🇷 韓国語から</option>
    <option value="es-ES|es|Spanish">🇪🇸 スペイン語から</option>
    <option value="fr-FR|fr|French">🇫🇷 フランス語から</option>
    <option value="de-DE|de|German">🇩🇪 ドイツ語から</option>
  </select>
  <button class="swap-btn" onclick="swapLanguages()">⇄</button>
  <select id="langTo" onchange="restartIfRunning()">
    <option value="en-US|en|English" selected>🇺🇸 英語へ</option>
    <option value="ja-JP|ja|Japanese">🇯🇵 日本語へ</option>
    <option value="zh-CN|zh-CN|Chinese">🇨🇳 中国語へ</option>
    <option value="ko-KR|ko|Korean">🇰🇷 韓国語へ</option>
    <option value="es-ES|es|Spanish">🇪🇸 スペイン語へ</option>
    <option value="fr-FR|fr|French">🇫🇷 フランス語へ</option>
    <option value="de-DE|de|German">🇩🇪 ドイツ語へ</option>
  </select>
</div>

<div class="log-box" id="logBox">
  <div class="status" id="statusText">「通訳開始」を押して話してください（最速0.25秒間隔先行翻訳）</div>
  <div class="live-card" id="liveCard">
    <div class="live-orig" id="liveOrig"></div>
    <div class="live-trans" id="liveTrans"></div>
  </div>
</div>

<button class="main-btn" id="toggleBtn" onclick="toggleRecognition()">通訳開始</button>

<div id="apiModal">
  <div class="modal-card">
    <h3 style="margin-top:0">Gemini APIキー設定</h3>
    <input type="password" id="apiKeyInput" placeholder="APIキーを貼り付け..." />
    <button class="main-btn" style="padding:12px; font-size:1rem;" onclick="saveKey()">保存する</button>
  </div>
</div>

<script>
  let recognition = null;
  let isRunning = false;
  let interimTimer = null;
  let activeController = null;
  let lastInterimQuery = "";
  let lastInterimResult = "";
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  window.onload = () => {
    if (!localStorage.getItem("gemini_api_key")) openModal();
  };

  function openModal() {
    document.getElementById("apiKeyInput").value = localStorage.getItem("gemini_api_key") || "";
    document.getElementById("apiModal").style.display = "flex";
  }

  function saveKey() {
    const key = document.getElementById("apiKeyInput").value.trim();
    if (key) {
      localStorage.setItem("gemini_api_key", key);
      document.getElementById("apiModal").style.display = "none";
      setStatus("APIキーを保存しました。「通訳開始」を押してください");
    }
  }

  function setStatus(msg) {
    document.getElementById("statusText").textContent = msg;
  }

  function clearLogs() {
    const box = document.getElementById("logBox");
    const status = document.getElementById("statusText");
    const liveCard = document.getElementById("liveCard");
    box.innerHTML = "";
    box.appendChild(status);
    box.appendChild(liveCard);
  }

  function swapLanguages() {
    const fromSel = document.getElementById("langFrom");
    const toSel = document.getElementById("langTo");
    const temp = fromSel.value;
    fromSel.value = toSel.value;
    toSel.value = temp;
    restartIfRunning();
  }

  function restartIfRunning() {
    if (isRunning) {
      stopRecognition(false);
      setTimeout(() => startRecognition(), 100);
    }
  }

  function toggleRecognition() {
    if (isRunning) {
      stopRecognition(true);
    } else {
      startRecognition();
    }
  }

  function startRecognition() {
    const apiKey = localStorage.getItem("gemini_api_key");
    if (!apiKey) return openModal();
    if (!SpeechRecognition) return setStatus("Safariをご利用ください");

    const [fromSpeech, fromIso, fromName] = document.getElementById("langFrom").value.split("|");
    const [, toIso, toName] = document.getElementById("langTo").value.split("|");

    recognition = new SpeechRecognition();
    recognition.lang = fromSpeech;
    recognition.interimResults = true;
    recognition.continuous = true;

    const btn = document.getElementById("toggleBtn");
    const liveCard = document.getElementById("liveCard");
    const liveOrig = document.getElementById("liveOrig");
    const liveTrans = document.getElementById("liveTrans");

    recognition.onstart = () => {
      isRunning = true;
      btn.textContent = "通訳を停止";
      btn.classList.add("active");
      setStatus(`⚡ 最速モード稼働中`);
    };

    recognition.onresult = (event) => {
      let interimTranscript = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          clearTimeout(interimTimer);
          const finalText = transcript.trim();
          const preTranslated = (lastInterimQuery === finalText && lastInterimResult) ? lastInterimResult : null;
          liveCard.style.display = "none";
          liveOrig.textContent = "";
          liveTrans.textContent = "";
          lastInterimQuery = "";
          lastInterimResult = "";
          createAndTranslateCard(finalText, fromIso, toIso, toName, apiKey, preTranslated);
        } else {
          interimTranscript += transcript;
        }
      }

      if (interimTranscript) {
        const cleanInterim = interimTranscript.trim();
        liveCard.style.display = "block";
        liveOrig.textContent = "🎤 " + cleanInterim;
        document.getElementById("logBox").scrollTop = document.getElementById("logBox").scrollHeight;

        if (cleanInterim.length >= 2 && cleanInterim !== lastInterimQuery) {
          clearTimeout(interimTimer);
          interimTimer = setTimeout(async () => {
            lastInterimQuery = cleanInterim;
            try {
              const res = await translateUltraFast(cleanInterim, fromIso, toIso, toName, apiKey, liveTrans, true);
              if (liveCard.style.display === "block" && lastInterimQuery === cleanInterim) {
                lastInterimResult = res;
              }
            } catch (e) {}
          }, 250);
        }
      }
    };

    recognition.onerror = (event) => {
      if (event.error === "no-speech") return;
      if (event.error === "not-allowed") stopRecognition(true);
    };

    recognition.onend = () => {
      if (isRunning) {
        try { recognition.start(); } catch (e) {}
      }
    };

    try { recognition.start(); } catch (e) {}
  }

  function stopRecognition(updateUi) {
    isRunning = false;
    clearTimeout(interimTimer);
    if (activeController) activeController.abort();
    if (recognition) {
      recognition.onend = null;
      try { recognition.stop(); } catch (e) {}
      recognition = null;
    }
    document.getElementById("liveCard").style.display = "none";
    if (updateUi) {
      const btn = document.getElementById("toggleBtn");
      btn.textContent = "通訳開始";
      btn.classList.remove("active");
      setStatus("停止中");
    }
  }

  async function translateUltraFast(text, fromIso, toIso, toName, apiKey, targetEl, isInterim) {
    if (isInterim && activeController) activeController.abort();
    const controller = new AbortController();
    if (isInterim) activeController = controller;
    const timeoutId = setTimeout(() => controller.abort(), 2000);

    try {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash-lite:streamGenerateContent?alt=sse&key=${apiKey}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: controller.signal,
          body: JSON.stringify({
            contents: [{ parts: [{ text: `To ${toName}:\n${text}` }] }],
            generationConfig: {
              temperature: 0.1,
              maxOutputTokens: 150,
              thinkingConfig: { thinkingBudget: 0 }
            }
          })
        }
      );
      clearTimeout(timeoutId);

      if (res.ok) {
        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let fullText = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const lines = decoder.decode(value, { stream: true }).split("\n");
          for (const line of lines) {
            if (line.startsWith("data: ")) {
              try {
                const part = JSON.parse(line.slice(6)).candidates?.[0]?.content?.parts?.[0]?.text;
                if (part) {
                  fullText += part;
                  if (targetEl) targetEl.textContent = fullText.trim();
                }
              } catch (e) {}
            }
          }
        }
        if (fullText.trim()) return fullText.trim();
      }
    } catch (e) {
      clearTimeout(timeoutId);
      if (e.name === "AbortError" && isInterim) return "";
    }

    // 2秒以内で返らない場合の即座フォールバック
    const fbRes = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromIso}|${toIso}`);
    const fbData = await fbRes.json();
    const fbText = fbData.responseData?.translatedText || "";
    if (targetEl && fbText) targetEl.textContent = fbText;
    return fbText;
  }

  async function createAndTranslateCard(originalText, fromIso, toIso, toName, apiKey, preTranslated) {
    if (!originalText) return;
    const box = document.getElementById("logBox");
    const liveCard = document.getElementById("liveCard");

    const card = document.createElement("div");
    card.className = "card-item";

    const origDiv = document.createElement("div");
    origDiv.className = "orig-text";
    origDiv.textContent = originalText;

    const transDiv = document.createElement("div");
    transDiv.className = "trans-text";
    transDiv.textContent = preTranslated || "...";

    card.appendChild(origDiv);
    card.appendChild(transDiv);
    box.insertBefore(card, liveCard);
    box.scrollTop = box.scrollHeight;

    if (preTranslated) return;

    try {
      await translateUltraFast(originalText, fromIso, toIso, toName, apiKey, transDiv, false);
    } catch (err) {
      transDiv.textContent = "エラー: " + err.message;
    }
    box.scrollTop = box.scrollHeight;
  }
</script>
</body>
</html>
